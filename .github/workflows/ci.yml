name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install pylint
      - name: Lint
        run: python -m pylint --rcfile=pylint.rc proxytypes3 setup.py tests.py
      - name: Run unit tests
        run: python -m unittest tests
      - name: Run doctests
        run: python -m doctest README.md quirky-tests.txt -o ELLIPSIS